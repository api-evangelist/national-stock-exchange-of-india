note: >-
  NSE publishes NO first-party client library in any language and no public source repository —
  npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist and crates.io were searched and
  there is no NSE-authored package. Members implement the published binary/JSON protocol documents
  directly, or buy front-end software from Exchange-empanelled vendors and Application Service
  Providers. The packages below are third-party, community-maintained scrapers of the undocumented
  www.nseindia.com/api/* website endpoints — they are recorded for completeness and are explicitly
  NOT first-party, so no `SDKs` pointer is wired in apis.yml.

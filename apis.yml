apis:
- name: NSE RFQ Web API
  description: 'JSON over HTTPS Web API for the NSE Request-for-Quote (RFQ) platform for corporate
    bonds and debt securities. Documented in the "RFQ - Protocol for Web API" PDF published on the
    NSE trading protocols page: 41 operations across login/session, RFQ master, market watch,
    negotiation, deal, deal amendment, participant group, participant limit and portfolio limit,
    plus an optional participant-implemented callback API for RFQ notifications.'
  humanURL: https://www.nseindia.com/static/trade/platform-services-neat-trading-system-protocols
  baseURL: https://bricsonline.nseindia.com/rfq
  tags:
  - RFQ
  - Bonds
  - Debt
  - Negotiation
  properties:
  - type: Documentation
    url: https://nsearchives.nseindia.com/web/mediaattachment/2026-07/RFQ_-_Protocol_for_Web_API_-_Ver_1.1.10_20260703110148.pdf
  - type: APIReference
    url: https://nsearchives.nseindia.com/web/mediaattachment/2026-07/RFQ_-_Protocol_for_Web_API_-_Ver_1.1.10_20260703110148.pdf
- name: NSE CBRICS Web API
  description: 'JSON over HTTPS Web API for CBRICS (Corporate Bond Reporting and Integrated Clearing
    System), NSE''s reporting and settlement platform for corporate bond trades. Documented in the
    "WEB CBRICS PROTOCOL" PDF on the NSE trading protocols page; an API-enabled CBRICS user is the
    prerequisite for enabling the RFQ Web API.'
  humanURL: https://www.nseindia.com/static/trade/platform-services-neat-trading-system-protocols
  baseURL: https://bricsonline.nseindia.com/bondsnew
  tags:
  - CBRICS
  - Bonds
  - Reporting
  properties:
  - type: Documentation
    url: https://nsearchives.nseindia.com/web/mediaattachment/2026-02/WEB_CBRICS_PROTOCOL_1.16_20260216103027.pdf
- name: NSE Offer For Sale (OFS) Web API
  description: 'JSON over HTTPS Web API for the NSE Offer-For-Sale platform, used by members to place,
    modify, cancel and query OFS orders and to stream market messages. Bearer access-token
    authentication with a refresh-token endpoint; includes a server-sent message stream
    (GET /messaging/message-stream). Documented in the "OFS-WEB API" PDF on the NSE trading
    protocols page.'
  humanURL: https://www.nseindia.com/static/trade/platform-services-neat-trading-system-protocols
  baseURL: https://eofs.nseindia.com/api/
  tags:
  - Offer For Sale
  - Orders
  - Equities
  properties:
  - type: Documentation
    url: https://nsearchives.nseindia.com/web/mediaattachment/2026-05/OFS-WEB_API_Ver1.3.4_20260519122437.pdf

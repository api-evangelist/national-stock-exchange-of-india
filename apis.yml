aid: national-stock-exchange-of-india
name: National Stock Exchange of India
description: 'National Stock Exchange of India Ltd (NSE) is India''s largest stock exchange, operating
  the Capital Market, Futures & Options, Currency Derivatives, Commodity Derivatives, Debt and
  Electronic Gold Receipts segments, together with NSE Clearing, NSE Indices and NSE Data & Analytics
  Ltd (formerly DotEx International). NSE exposes its trading and post-trade systems to members and
  empanelled vendors through a published protocol surface rather than a public developer portal:
  binary Non-NEAT Front-End (NNF) and multicast tick-by-tick (MTBT) trading protocols, a Drop Copy
  facility, an Extranet API, a FIX 5.0 (SP2) interface for the RFQ platform, and JSON/HTTPS Web APIs
  for the RFQ, CBRICS bond, e-IPO/ASBA, Offer-For-Sale and MFSS platforms. Every one of those
  interfaces is documented only as a PDF or ZIP protocol document — NSE publishes no OpenAPI,
  AsyncAPI, SDK, Postman collection or machine-readable contract of any kind. Market data itself is
  vended commercially by NSE Data & Analytics under a subscription and data-vending agreement.'
